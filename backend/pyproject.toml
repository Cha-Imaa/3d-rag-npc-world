[project]
name = "loreland-backend"
version = "0.1.0"
description = "API for Loreland: NPC conversations, retrieval, and memory."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
