# Test questions for checking retrieval and tuning the score floor.
#
# Each question is asked of one NPC, so only that NPC's knowledge base is searched.
#
#   npc_id            The NPC the question is asked of.
#   question          What the visitor types.
#   expected_sources  The source files that should answer it. An empty list means nothing
#                     in this NPC's knowledge base should help, so ideally no passage passes
#                     the score floor.
#   purpose           Why the question is here:
#                       "own"       answered by this NPC's own documents, often in other words
#                       "isolation" a fact that exists only in another NPC's documents
#                       "unrelated" nothing to do with any document
#
# Every fact comes from the invented test documents in data/sources/.

# --- Answered by the NPC's own documents ---

[[questions]]
npc_id = "placeholder-one"
question = "Who built the weather station, and in which year?"
expected_sources = ["weather-record.txt"]
